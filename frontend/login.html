<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PhishGuard - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen font-sans">

  <div class="w-full max-w-md bg-slate-800 p-8 rounded-xl border border-slate-700 shadow-2xl">
    <h2 id="form-title" class="text-2xl font-bold text-center text-white mb-6">Sign In to PhishGuard</h2>
    
    <form id="authForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-400">Email Address</label>
        <input type="email" id="email" required class="w-full mt-1 p-2 bg-slate-900 border border-slate-700 rounded text-white focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-400">Password</label>
        <input type="password" id="password" required class="w-full mt-1 p-2 bg-slate-900 border border-slate-700 rounded text-white focus:ring-blue-500">
      </div>
      <p id="error-msg" class="text-red-400 text-sm hidden"></p>
      
      <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded transition">
        Sign In
      </button>
    </form>
    
    <p class="text-center text-slate-400 mt-4 text-sm">
      <span id="toggle-text">Don't have an account?</span> 
      <button onclick="toggleMode()" class="text-blue-400 hover:underline">Click here</button>
    </p>
  </div>

  <script>
    if (localStorage.getItem('pg_token')) window.location.href = '/dashboard';

    let isLogin = true;

    function toggleMode() {
      isLogin = !isLogin;
      document.getElementById('form-title').innerText = isLogin ? "Sign In to PhishGuard" : "Create an Account";
      document.getElementById('submit-btn').innerText = isLogin ? "Sign In" : "Sign Up";
      document.getElementById('toggle-text').innerText = isLogin ? "Don't have an account?" : "Already have an account?";
      document.getElementById('error-msg').classList.add('hidden');
    }

    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');

      try {
        if (isLogin) {
          const formData = new URLSearchParams();
          formData.append("username", email);
          formData.append("password", password);
          
          const res = await fetch('/api/v1/auth/login', { method: 'POST', body: formData });
          if (res.ok) {
            const data = await res.json();
            localStorage.setItem('pg_token', data.access_token);
            
            // BROADCAST TOKEN TO CHROME EXTENSION
            window.postMessage({ type: "PG_LOGIN_SUCCESS", token: data.access_token }, "*");
            
            setTimeout(() => { window.location.href = '/dashboard'; }, 100);
          } else {
            errorMsg.innerText = "Invalid email or password.";
            errorMsg.classList.remove('hidden');
          }
        } else {
          const res = await fetch('/api/v1/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          if (res.ok) {
            alert("Account created! Please sign in.");
            toggleMode();
          } else {
            const data = await res.json();
            errorMsg.innerText = data.detail || "Registration failed.";
            errorMsg.classList.remove('hidden');
          }
        }
      } catch (err) {
        errorMsg.innerText = "Server error. Please try again.";
        errorMsg.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
